[package]
name = "newslatest-server"
version = "0.1.0"
edition = "2021"

[profile.release]
# 启用最大优化
lto = true           # 链接时优化
codegen-units = 1   # 减少代码生成单元以获得更好优化
panic = "abort"      # 使用 abort 而不是 unwind
strip = true        # 剥离调试符号
opt-level = "z"     # 优化体积
overflow-checks = false

# 图标配置
[package.metadata.winres]
original_filename = "newslatest-server.exe"
internal_name = "newslatest-server"
file_description = "NewsLatest API Server"
product_name = "NewsLatest"
product_version = "0.1.0"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json"] }
dashmap = "5.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
rss = "2.0"
select = "0.6"
scraper = "0.19"
html5ever = "0.26"
markup5ever = "0.11"
regex = "1.0"
serde_with = { version = "3.0", features = ["chrono"] }
urlencoding = "2.1"
toml = "0.8"
futures = "0.3"
url = "2.5"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[[bin]]
name = "newslatest-server"
path = "src/main.rs"
